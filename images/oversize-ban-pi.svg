<text x="250" y="840" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#161616" text-anchor="start" font-weight="normal">oversize banned</text>
<text x="44" y="880" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#161616" text-anchor="start" font-weight="normal">At the rover's real frame rate the deleted path held the workload in 158 MiB; the smallest page that accepts a 1 MiB frame costs ~590 MiB — 3.7x, for no gain in speed.</text>
<text x="44" y="900" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#161616" text-anchor="start" font-weight="normal">A 1 MiB frame misses a 1 MiB page by 11 bytes (varint length + CRC + offset slot), so 4 MB is the floor. The 50 B CAN workload is unaffected either way.</text>
<text x="44" y="920" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b6b6b" text-anchor="start" font-weight="normal">What the ban buys in exchange: ~410 fewer lines of unproven Rust in the flush and read paths.</text>
