<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940">
<rect width="1280" height="940" fill="#ffffff"/>
<text x="44" y="46" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#161616" text-anchor="start" font-weight="700">Banning oversize records: what it costs the rover's camera</text>
<text x="44" y="72" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="start" font-weight="normal">Raspberry Pi 5, disk-bound. Peak process memory, mean of two rounds with the run order rotated. Lower is better.</text>
