<text x="88" y="600" font-size="12.5" fill="#626B7A">The camera&#8217;s real load (1 MiB at 20/s, paced) is cheap at every page size: 5-9% of one core on the Pi, 10-13% on x86, so the knob does not matter there either.</text>
<text x="88" y="620" font-size="12.5" fill="#626B7A">What page size does decide: the per-record cap if oversize records are banned, RAM per idle queue (2 pages), and how many chunks the budget divides into.</text>
<text x="88" y="640" font-size="12.5" fill="#626B7A">A burst of 1 MiB records peaks at ~2x the RSS on 4m/16m pages: paged placement keeps a full arena in flight where the oversize path throttles earlier.</text>
</svg>