<text x="88" y="62" font-size="34" font-weight="700" fill="#1f2328">Page size: what it changes, what it does not</text>
<text x="88" y="92" font-size="14.5" fill="#3A424F">One knob, five values (64 KiB to 16 MiB), the rover&#8217;s two record sizes: CAN (~50 B) and camera frames (1 MiB) - medians of 2 rounds, order rotated</text>
<text x="88" y="113" font-size="14.5" fill="#626B7A">branch feat/v1-page-pool dfe0f41 | throughput moved with run order and disk state, not with page size, so it is not charted - CPU and RSS repeated</text>
