[package]
name = "normfs-wal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Write-ahead log implementation for NormFS with crash recovery"

[dependencies]
log = "0.4"
bytes = "1"
uintn = { version = "0.2.0-beta.0", path = "../uintn-rs" }
normfs-types = { version = "0.2.0-beta.0", path = "../normfs-types" }
tokio = { version = "1", features = ["full"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
walkdir = "2"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
criterion = "0.5"
env_logger = { workspace = true }
rand = "0.8"

# V0-vs-V1 WAL benchmarks. Warmup and measurement windows default to 5s / 30s
# and are overridable with WAL_BENCH_WARMUP / WAL_BENCH_MEASURE (seconds).
[[bench]]
name = "wal_v1_codec"
harness = false

[[bench]]
name = "wal_v1_scan"
harness = false

[[bench]]
name = "wal_v1_sizes"
harness = false

[[bench]]
name = "wal_memory"
harness = false